name: Build Amethyst IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply Dopamine UI overlay
        run: unzip -o dopamine-ui-overlay.zip

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        run: |
          cd Amethyst
          chmod +x buildipa.sh
          ./buildipa.sh

      - name: Show build errors
        if: failure()
        run: grep -E "error:" Amethyst/xcodebuild.log | tail -40 || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TessXract-unsigned
          path: Amethyst/TessXract.ipa
          if-no-files-found: error
